[Unit]
Wants=redis-server.service postgresql.service
After=redis-server.service postgresql.service network-online.target
# never give up restarting
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=3
TimeoutStopSec=30
KillMode=mixed
LimitNOFILE=65535
ExecStopPost=+/usr/local/sbin/cc-crash-notify %N
