[project]
name = "api"
version = "1.0.0"
description = ""
authors = [{name = "Monica Jin", email = "monicachenjin@gmail.com"}]
requires-python = ">=3.12.1,<4"

[tool.poetry.dependencies]
python = ">=3.12.1,<4"
fastapi = { extras = ["standard"], version = ">=0.117.1,<0.118.0" }
loguru = ">=0.7.3,<0.8.0"
pydantic-settings = ">=2.11.0,<3.0.0"
web3 = ">=7.13.0,<8.0.0"
redis = ">=6.2.0,<7.0.0"
fastapi-cache2 = ">=0.2.2,<0.3.0"
sqlmodel = ">=0.0.25,<0.0.26"
psycopg2-binary = ">=2.9.10,<3.0.0"
crystal-clear = { path = "../crystal-clear", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
