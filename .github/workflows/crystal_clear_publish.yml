name: Publish Crystal-Clear PYPI Package

on:
  push:
    branches:
      - main
    paths:
      - 'webapp/backend/crystal-clear/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/backend/crystal-clear

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Bump Poetry version
        run: |
          echo "Bumping project version"
          poetry version patch
          NEW_VERSION=$(poetry version -s)
          echo "New version: $NEW_VERSION"

      - name: Commit and tag new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Bump version to $NEW_VERSION"
          git tag "crystal-clear-v$NEW_VERSION"
          git push origin main --tags

      - name: Configure Poetry for PyPI
        run: poetry config pypi-token.pypi ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish package
        run: poetry publish --build --no-interaction
