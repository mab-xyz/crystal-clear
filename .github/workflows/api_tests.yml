name: API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    runs-on: ubuntu-latest
    name: API-Tests
    defaults:
      run:
        working-directory: webapp/backend

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install poetry==2.0.1

      - name: Configure Poetry to create venv in project
        run: poetry config virtualenvs.in-project true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: webapp/backend/.venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('webapp/backend/pyproject.toml') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Install test extras
        run: poetry run pip install pytest-cov httpx

      - name: Run tests with coverage gate
        run: |
          poetry run pytest -q tests --cov=src/api --cov-report=term-missing --cov-fail-under=90
